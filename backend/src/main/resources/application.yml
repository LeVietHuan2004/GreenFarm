server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  application:
    name: greenfarm-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:veggie_main}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  jackson:
    time-zone: Asia/Ho_Chi_Minh

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_SMTP_STARTTLS_ENABLE:true}

  data:
    web:
      pageable:
        max-page-size: 50
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:GreenFarmLocalDevelopmentSecretMustBeAtLeast32Chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
  security:
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      lock-duration-minutes: ${LOGIN_LOCK_DURATION_MINUTES:15}
  payment:
    frontend-result-url: ${PAYMENT_FRONTEND_RESULT_URL:http://localhost:3000/payment-result}
    expiration-scan-ms: ${PAYMENT_EXPIRATION_SCAN_MS:60000}
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      refund-url: ${VNPAY_REFUND_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      return-url: ${VNPAY_RETURN_URL:}
  storefront-url: ${STOREFRONT_URL:http://localhost:3000}
  invoice:
    email-enabled: ${INVOICE_EMAIL_ENABLED:false}
    from: ${INVOICE_EMAIL_FROM:}
    max-attempts: ${INVOICE_EMAIL_MAX_ATTEMPTS:5}
    base-retry-minutes: ${INVOICE_EMAIL_BASE_RETRY_MINUTES:2}
    retry-scan-ms: ${INVOICE_EMAIL_RETRY_SCAN_MS:60000}
  upload:
    directory: ${UPLOAD_DIRECTORY:uploads}
    max-image-bytes: ${UPLOAD_MAX_IMAGE_BYTES:5242880}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
  chat:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash}
  guest:
    session-days: ${GUEST_SESSION_DAYS:30}
  inventory:
    expiry-warning-days: ${INVENTORY_EXPIRY_WARNING_DAYS:3}
    expiry-scan-ms: ${INVENTORY_EXPIRY_SCAN_MS:60000}

logging:
  level:
    root: INFO
    com.agri.ecommerce: ${APP_LOG_LEVEL:INFO}
