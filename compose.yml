services:
  mysql:
    image: mysql:8.0.44
    container_name: greenfarm-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: veggie_main
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-greenfarm}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - greenfarm_mysql_data:/var/lib/mysql
      - ./database/local/veggie-main.sql:/docker-entrypoint-initdb.d/001-veggie-main.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: greenfarm-backend:local
    container_name: greenfarm-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: veggie_main
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-greenfarm}
      FLYWAY_ENABLED: "true"
      JPA_SHOW_SQL: "false"
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
      PAYMENT_FRONTEND_RESULT_URL: ${PAYMENT_FRONTEND_RESULT_URL:-http://localhost:3000/payment-result}
      PAYMENT_EXPIRATION_SCAN_MS: ${PAYMENT_EXPIRATION_SCAN_MS:-60000}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_REFUND_URL: ${VNPAY_REFUND_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-}
      STOREFRONT_URL: ${STOREFRONT_URL:-http://localhost:3000}
      INVOICE_EMAIL_ENABLED: ${INVOICE_EMAIL_ENABLED:-false}
      INVOICE_EMAIL_FROM: ${INVOICE_EMAIL_FROM:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}
      INVOICE_EMAIL_MAX_ATTEMPTS: ${INVOICE_EMAIL_MAX_ATTEMPTS:-5}
      INVOICE_EMAIL_BASE_RETRY_MINUTES: ${INVOICE_EMAIL_BASE_RETRY_MINUTES:-2}
      INVOICE_EMAIL_RETRY_SCAN_MS: ${INVOICE_EMAIL_RETRY_SCAN_MS:-60000}
      UPLOAD_DIRECTORY: /app/uploads
      UPLOAD_MAX_IMAGE_BYTES: ${UPLOAD_MAX_IMAGE_BYTES:-5242880}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-30}
      GUEST_SESSION_DAYS: ${GUEST_SESSION_DAYS:-30}
      INVENTORY_EXPIRY_WARNING_DAYS: ${INVENTORY_EXPIRY_WARNING_DAYS:-3}
      INVENTORY_EXPIRY_SCAN_MS: ${INVENTORY_EXPIRY_SCAN_MS:-60000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - greenfarm_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  greenfarm_mysql_data:
  greenfarm_uploads:
